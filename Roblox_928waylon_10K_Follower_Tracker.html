<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>928waylon — 10K Tracker</title>
<style>
body{margin:0;background:linear-gradient(135deg,#090b11,#171d2d);color:#fff;font:16px Arial;padding:30px}.box{max-width:760px;margin:auto;background:#111622;border:1px solid #30384a;border-radius:22px;padding:28px;box-shadow:0 20px 60px #0008}.profile{display:flex;gap:16px;align-items:center}.avatar{width:80px;height:80px;border-radius:18px;background:#222938}.muted{color:#929caf}.stats{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px}.stat{background:#0b0f18;border:1px solid #2b3445;border-radius:16px;padding:20px}.num{font-size:32px;font-weight:900;margin-top:6px}.bar{height:14px;background:#293143;border-radius:99px;overflow:hidden;margin-top:10px}.fill{height:100%;width:0;background:#5865f2;transition:.5s}.row{display:flex;justify-content:space-between}.actions{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}button{border:0;border-radius:11px;padding:13px 17px;background:#5865f2;color:#fff;font-weight:800;cursor:pointer}button.secondary{background:#293143}.status{margin-top:15px;color:#aeb7c9;font-size:13px}.milestones{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.m{padding:10px 13px;background:#0b0f18;border:1px solid #30384a;border-radius:10px;color:#7f899c}.done{color:#fff;border-color:#5865f2}
@media(max-width:600px){.stats{grid-template-columns:1fr}.profile{align-items:flex-start}}
</style></head><body><main class="box">
<div class="profile"><img id="avatar" class="avatar"><div><h1 style="margin:0">928waylon</h1><div id="info" class="muted">Loading Roblox profile…</div></div></div>
<div class="stats"><div class="stat"><div class="muted">CURRENT FOLLOWERS</div><div id="followers" class="num">—</div></div><div class="stat"><div class="muted">GOAL</div><div class="num">10,000</div></div></div>
<div style="margin-top:22px"><div class="row"><span class="muted">Progress</span><b id="pct">0%</b></div><div class="bar"><div id="fill" class="fill"></div></div><div id="remain" class="muted" style="margin-top:8px">10,000 remaining</div></div>
<div class="milestones"><span class="m" data-n="100">100</span><span class="m" data-n="1000">1K</span><span class="m" data-n="2500">2.5K</span><span class="m" data-n="5000">5K</span><span class="m" data-n="10000">10K</span></div>
<div class="actions"><button onclick="load()">↻ Refresh</button><button class="secondary" onclick="profile()">Open Roblox Profile</button></div>
<div id="status" class="status"></div>
</main>
<script>
let userId=null;
async function findUser(){let r=await fetch("https://users.roblox.com/v1/usernames/users",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({usernames:["928waylon"],excludeBannedUsers:false})});if(!r.ok)throw Error("Roblox username lookup failed.");let j=await r.json();if(!j.data?.length)throw Error("928waylon was not found.");return j.data[0]}
async function load(){let s=document.getElementById("status");s.textContent="Loading live Roblox stats…";try{let u=await findUser();userId=u.id;let [c,i,t]=await Promise.all([fetch(`https://friends.roblox.com/v1/users/${u.id}/followers/count`),fetch(`https://users.roblox.com/v1/users/${u.id}`),fetch(`https://thumbnails.roblox.com/v1/users/avatar-headshot?userIds=${u.id}&size=150x150&format=Png&isCircular=false`)]);if(!c.ok)throw Error("Follower count could not be loaded.");let n=Number((await c.json()).count||0);let info=i.ok?await i.json():{};let th=t.ok?await t.json():{};document.getElementById("followers").textContent=n.toLocaleString();document.getElementById("info").textContent=(info.displayName&&info.displayName!=="928waylon"?info.displayName+" • ":"")+"User ID: "+u.id;if(th.data?.[0]?.imageUrl)document.getElementById("avatar").src=th.data[0].imageUrl;let p=Math.min(100,n/10000*100);document.getElementById("pct").textContent=p.toFixed(p<1?2:1)+"%";document.getElementById("fill").style.width=p+"%";document.getElementById("remain").textContent=n>=10000?"🎉 10K GOAL REACHED!":(10000-n).toLocaleString()+" followers remaining";document.querySelectorAll(".m").forEach(x=>x.classList.toggle("done",n>=+x.dataset.n));s.textContent="Updated "+new Date().toLocaleTimeString()}catch(e){s.textContent=e.message+" Try again or host the HTML on HTTPS/GitHub Pages."}}
function profile(){if(userId)window.open("https://www.roblox.com/users/"+userId+"/profile","_blank")}
load();setInterval(load,60000);
</script></body></html>
